# Apache virtual host for snek.ethanantonio.com
# Separate hostname from the existing playground static site, so there is
# no ServerName collision. Reverse-proxies all traffic to the Node process
# bound to 127.0.0.1:8080.
#
# Required modules (enable once, server-wide):
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#
# TLS is terminated at Cloudflare. Keep the Cloudflare DNS record for this
# subdomain Proxied (orange cloud); WebSockets then work with no extra config.
# For SSL mode Full (strict), add a matching *:443 vhost with a Cloudflare
# Origin Certificate and the same two ProxyPass blocks.

<VirtualHost *:80>
    ServerName snek.ethanantonio.com

    # The game WebSocket. This MUST come before the catch-all HTTP rule below.
    ProxyPass        /ws  ws://127.0.0.1:8080/ws
    ProxyPassReverse /ws  ws://127.0.0.1:8080/ws

    # Everything else: client HTML, /api/captcha, /api/verify.
    ProxyPass        /    http://127.0.0.1:8080/
    ProxyPassReverse /    http://127.0.0.1:8080/

    ProxyPreserveHost On

    ErrorLog  ${APACHE_LOG_DIR}/snek_error.log
    CustomLog ${APACHE_LOG_DIR}/snek_access.log combined
</VirtualHost>
