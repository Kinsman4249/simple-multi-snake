<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multisnake</title>
<style>
  /* Phase 5: the board is the page. A full-viewport flex column holds the
     status line and the letterboxed board; the leaderboard is a fixed
     hover-to-reveal overlay (it no longer competes with the much wider
     board for layout space), and the corner buttons live in a fading top
     bar built by ui.js. */
  html, body { height: 100%; }
  body {
    background: #111;
    color: #eee;
    font-family: monospace;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  #layout {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }
  #boardWrap {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* The canvas's INTERNAL resolution stays cols*cellSize x rows*cellSize
     (render.js resize()); its CSS size is set by render.js fitCanvas() to
     the largest 16:9 fit in #boardWrap, preferring integer scales.
     Pixelated keeps upscaled cells crisp instead of blurry. */
  canvas { background: #000; border: 2px solid #555; image-rendering: pixelated; touch-action: none; }
  /* Leaderboard overlay: barely-there during play, solid on hover/tap. */
  .panel {
    position: fixed; top: 40px; right: 8px; width: 220px; z-index: 9990;
    background: rgba(17,17,17,0.92); border: 1px solid #444; padding: 8px 12px;
    opacity: 0.08; transition: opacity 0.25s;
  }
  .panel:hover, .panel:focus-within { opacity: 1; }
  .panel h3 { margin: 0 0 6px 0; font-size: 14px; border-bottom: 1px solid #444; padding-bottom: 4px; }
  .panel ol { margin: 4px 0 16px 0; padding-left: 20px; font-size: 13px; }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
  }
  #overlay .box {
    background: #1a1a1a; border: 1px solid #444; padding: 24px; text-align: center;
  }
  #overlay input {
    background: #000; color: #6f6; border: 1px solid #666; font-family: monospace;
    font-size: 20px; text-align: center; width: 4ch; margin-top: 10px;
  }
  #overlay button {
    background: #333; color: #eee; border: 1px solid #666; padding: 6px 14px;
    margin-top: 10px; cursor: pointer; font-family: monospace;
  }
  #status { font-size: 13px; margin-bottom: 8px; min-height: 18px; }
  .err { color: #f66; }
  #boostTip {
    background: #14201a; border: 1px solid #3a5; padding: 14px 18px; margin-bottom: 14px;
    text-align: left; max-width: 320px; font-size: 12px; line-height: 1.5; color: #cfc;
  }
  #boostTip h4 { margin: 0 0 6px 0; font-size: 13px; color: #9f9; }
  #boostTip button {
    margin-top: 10px; background: #234; color: #bdf; border: 1px solid #57a;
    padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: monospace;
  }
  #boostTip.acked { opacity: 0.45; }
  #boostTip.acked button { display: none; }
  #powerupInfoBtn {
    background: #241a2e; color: #c9f; border: 1px solid #758;
    padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: monospace;
    margin-bottom: 10px;
  }
  /* Sized by JS per-popup (ui.js initPowerupInfo) based on how many powerups
     the server reports -- these are just the base look + a scroll fallback
     for an unusually large list. */
  #powerupInfoPopup {
    display: none; background: #1a1428; border: 1px solid #758; padding: 12px 16px;
    margin-bottom: 14px; text-align: left; width: 320px; max-height: 60vh;
    overflow-y: auto; font-size: 12px; line-height: 1.5; color: #dcf;
  }
  #powerupLegend {
    display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center;
    max-width: 340px; margin: 0 auto 12px auto; font-size: 12px; color: #bbb;
  }
  #powerupLegend .sw {
    display: inline-block; width: 10px; height: 10px; margin-right: 5px;
    vertical-align: baseline;
  }
  #powerupInfoPopup h4 { margin: 0 0 6px 0; font-size: 13px; color: #c9f; }
  #powerupInfoPopup .entry { margin-bottom: 10px; }
  #powerupInfoPopup .entry:last-child { margin-bottom: 0; }
  #powerupInfoPopup .entry .name { color: #c9f; font-weight: bold; }
  #powerupInfoPopup.open { display: block; }
</style>
</head>
<body>

<div id="layout">
  <div id="status">connecting...</div>
  <div id="boardWrap">
    <canvas id="game" width="1920" height="1080"></canvas>
  </div>
</div>
<!-- Fixed hover-to-reveal overlay (see .panel CSS above), not part of the
     board's layout flow. -->
<div class="panel">
  <h3>Daily Top 5</h3>
  <ol id="dailyList"></ol>
  <h3>All-Time Top 5</h3>
  <ol id="allTimeList"></ol>
</div>

<!-- Captcha / gate overlay, shown before a WebSocket connection is attempted -->
<div id="overlay">
  <div class="box">
    <!-- Shown while the captcha is being solved, so a new player reads it
         before their snake ever moves. "Got it" is a one-tap, non-blocking
         acknowledgement (see ui.js initCaptchaGate) -- it does not gate Join,
         it just confirms the player noticed the mechanic. -->
    <div id="boostTip">
      <h4>Boost &amp; Slide</h4>
      Hold the key you're already moving in to speed up.<br>
      Turning while boosting drifts a couple squares before it takes effect
      &mdash; let off boost first for a sharp turn.
      <div><button id="boostTipAck">Got it</button></div>
    </div>
    <!-- Powerup explainer: a plain toggle button + popup (see ui.js
         initPowerupInfo), independent of the boost tip above and not gated
         on captcha state either. Content and popup size come from the
         server's /api/config powerupInfo (sourced from each powerup's own
         JS file, see powerups/*.js), so this list never has to be
         hand-kept in sync with what powerups actually exist. -->
    <button id="powerupInfoBtn" type="button">? What do the powerups do?</button>
    <!-- Color legend: one swatch+name per ENABLED powerup, filled in by
         ui.js setPowerupInfo from the same /api/config data as the popup
         and colored from render.js's own POWERUP_STYLE, so what a new
         player reads here is exactly what the board will draw. -->
    <div id="powerupLegend"></div>
    <div id="powerupInfoPopup"></div>
    <div id="captchaQuestion">Loading...</div>
    <div><input id="captchaAnswer" maxlength="2" autofocus></div>
    <button id="captchaSubmit">Join</button>
    <div id="captchaError" class="err"></div>
  </div>
</div>

<!-- Load order matters: main.js references everything before it. -->
<script src="js/net.js"></script>
<script src="js/predict.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
