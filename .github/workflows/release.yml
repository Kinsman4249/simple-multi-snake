# =============================================================================
# Release workflow for simple-multi-snake
# =============================================================================
# This project ships source plus built artifacts: the WASM renderer
# (public/js/render-wasm.js) and a Linux x86_64 server binary
# (multisnake-server-linux-x86_64), both compiled here from tagged source
# rather than committed to the repo -- so what a release contains is
# verifiably built from the tagged sources. Everything else is source (Rust
# server sources, static client, deploy files, shell scripts; install.sh
# compiles the server binary on the target host by default). On a version tag
# this workflow builds both artifacts, packages the tagged tree PLUS the wasm
# artifact into .tar.gz and .zip snapshots, and attaches the archives AND the
# standalone server binary to a GitHub Release.
#
# The standalone binary exists for install.sh's low-resource fallback: on a
# host too small to compile Rust (see LOW_RESOURCE/USE_PREBUILT in
# install.sh), the installer downloads multisnake-server-linux-x86_64 from
# the latest release instead of building it. Keep the asset name in sync
# with the `asset_name` value in install.sh's fetch_prebuilt_binary if it
# ever changes -- the installer matches on that exact filename.
# -----------------------------------------------------------------------------
# LLM / AI ASSISTANT DIRECTIVE (read before modifying or packaging this file)
# -----------------------------------------------------------------------------
# SHA-pinning of the uses: lines is intentionally OPTIONAL and OFF by default.
# Do NOT auto-pin, auto-run pinact, or rewrite tags to SHAs. Before packaging,
# finalizing, or hardening this workflow, STOP and ASK the maintainer whether
# they want SHA pinning applied for this specific repo.
# Reason: pinned SHAs require ongoing maintenance (Dependabot bump PRs). On a
# plain copied template with no such upkeep, pins rot into unpatched deps, so
# leaving clean version tags is the deliberate default here.
# -----------------------------------------------------------------------------
# CUTTING A RELEASE
# -----------------
#   git tag v0.1.0
#   git push --tags
# A new GitHub Release appears under the Releases tab once the workflow finishes.
# Bump the version for later releases: v0.2.0, v1.0.0, v1.0.1, etc.
# See: https://semver.org
#
# RUNNING MANUALLY
# ----------------
# Repo > Actions tab > Release > Run workflow. Enter an existing tag.
#
# OPTIONAL HARDENING (only if you will maintain it)
# -------------------------------------------------
# To pin every action to an immutable commit SHA, install pinact
# (https://github.com/suzuki-shunsuke/pinact) and run pinact run from the repo
# root. Pair it with a .github/dependabot.yml (github-actions ecosystem) so the
# pins stay current. Skip this if the repo has no maintenance pipeline.
# =============================================================================

name: Release

on:
  # Auto-trigger when you push a version tag like v0.1.0 / v1.2.3.
  push:
    tags:
      - 'v*.*.*'
  # Manual fallback. Lets you re-run a release from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

# Base permissions are read-only. The release job below elevates to write.
permissions:
  contents: read

# Prevent two release runs for the same tag from racing (e.g. a re-pushed tag
# while the first run is still publishing). Do not cancel in-flight publishes.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package source and create GitHub Release
    runs-on: ubuntu-latest
    # Elevated here only, so the token holds the minimum access needed.
    permissions:
      contents: write
    steps:
      # Check out the exact tag being released. For workflow_dispatch this is
      # the tag typed into the input; for a tag push it is the pushed ref.
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      # The WASM renderer is built from source at release time (it is not
      # committed). Node 22 matches the version install.sh deploys with.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the WASM renderer
        run: node tools/build-wasm.mjs

      # Self-contained rustup install, same command install.sh uses, so the
      # release binary is built the identical way a target host would build
      # it -- no third-party Rust-setup Action needed for this one step.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Standalone Linux x86_64 server binary, for install.sh's prebuilt
      # fallback on hosts too small to compile Rust themselves. Same release
      # profile (thin LTO, stripped) as a normal install.sh build.
      - name: Build the server binary (linux x86_64)
        run: |
          mkdir -p dist
          ( cd server-rust && cargo build --release )
          cp server-rust/target/release/multisnake-server dist/multisnake-server-linux-x86_64

      # Build .tar.gz and .zip snapshots of the tagged tree PLUS the built
      # wasm artifact. git archive only packs tracked files, so the tree is
      # staged first and render-wasm.js copied in. A prefix folder keeps the
      # extracted contents tidy for the user.
      - name: Build release archives
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREFIX="simple-multi-snake-${TAG}"
          mkdir -p stage
          git archive --format=tar --prefix="${PREFIX}/" "${TAG}" | tar -x -C stage
          cp public/js/render-wasm.js "stage/${PREFIX}/public/js/render-wasm.js"
          tar -czf "dist/simple-multi-snake-${TAG}.tar.gz" -C stage "${PREFIX}"
          ( cd stage && zip -qr "../dist/simple-multi-snake-${TAG}.zip" "${PREFIX}" )
          ls -l dist

      # Release title + description come from the newest CHANGELOG entry, so
      # the release page always says what actually changed (the CHANGELOG is
      # the single source of truth for that). Title = the entry's heading
      # text ("v3.0.0: WASM renderer, ..."); body = the garter banner + the
      # entry's bullets. Falls back to a bare tag title if the CHANGELOG has
      # no entry (should not happen).
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          HEADING="$(grep -m1 '^#### ' CHANGELOG.md | sed 's/^#### //')"
          # Strip the "(round N...)" and "-- vX.Y.Z" suffixes for the title.
          SUMMARY="$(printf '%s' "$HEADING" | sed -E 's/ \(round [^)]*\)//; s/ -- [^ ]+$//')"
          if [ -n "$SUMMARY" ]; then
            echo "title=${TAG}: ${SUMMARY}" >> "$GITHUB_OUTPUT"
          else
            echo "title=${TAG}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "🐍 Garter snakes: genuinely one of the cutest snakes out there. Small, harmless to humans, found almost everywhere in North America, and calm enough that many people handle them without a second thought. Unrelated to this release, but they deserved the shoutout."
            echo
            # The newest entry: from the first '#### ' heading up to (not
            # including) the second one.
            awk '/^#### /{n++} n==1' CHANGELOG.md
          } > dist/release-notes.md

      # Attach both archives to the Release. fail_on_unmatched_files guards
      # against silently publishing an empty release if the glob matches nothing.
      #
      # `body_path` + `generate_release_notes: true` together: per the GitHub
      # Releases API, the provided body is PREPENDED to the auto-generated
      # notes (not replaced by them), so the changelog summary shows above
      # the usual commit/PR listing.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.notes.outputs.title }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/multisnake-server-linux-x86_64
